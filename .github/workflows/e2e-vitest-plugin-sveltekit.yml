name: E2E vitest-plugin-sveltekit

# The tests of `packages/vitest-plugin-sveltekit/examples/kit-app` (`pnpm test:ci` in the package):
# `svelte-check`, the Vitest browser projects (component tests, server mode tests and every story
# through `@storybook/addon-vitest`), then Playwright against the app's production build and
# against `storybook dev` and the static Storybook. Slower than the unit tests, so it runs on its
# own, and only when the package, the Kit patch or the lockfile change.
on:
  push:
    branches: [main]
    paths:
      - packages/vitest-plugin-sveltekit/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/e2e-vitest-plugin-sveltekit.yml
  pull_request:
    paths:
      - packages/vitest-plugin-sveltekit/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/e2e-vitest-plugin-sveltekit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Example app, Storybook and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs vp at the catalog's vite-plus version, then runs `vp install`, which builds the
      # package (`prepare`) for the example.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # The example pins its own Playwright, so install the browser with that version.
      - name: Install Playwright Chromium
        run: pnpm -F vitest-plugin-sveltekit-kit-app-example exec playwright install --with-deps chromium

      - name: Example tests
        run: pnpm -F vitest-plugin-sveltekit test:ci
        env:
          CI: 'true'

  # Publishes the example's Storybook to Chromatic and runs the visual tests (UI Tests). The pushes
  # to main keep the Storybook that the package README links to current. Skipped on PRs from forks,
  # which don't get the project token.
  chromatic:
    name: Chromatic
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Chromatic reads the git history to find the baseline builds.
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Build Storybook
        run: pnpm -F vitest-plugin-sveltekit-kit-app-example storybook:build

      # The project ID is in the example's `chromatic.config.json`.
      - uses: chromaui/action@2b75e3340bcec86b4ae38c6a10f14831114e8137 # v18.14.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_VITEST_PLUGIN_SVELTEKIT }}
          workingDir: packages/vitest-plugin-sveltekit/examples/kit-app
          storybookBuildDir: storybook-static
