name: Chromatic vitest-plugin-sveltekit

# Publishes the Storybook of `packages/vitest-plugin-sveltekit/examples/kit-app` to Chromatic and
# runs its visual tests (UI Tests). Pushes to main keep the Storybook that the package README links
# to current. PRs build when they're opened or pushed to, but not while they're drafts: marking a
# draft ready for review starts the build.
on:
  push:
    branches: [main]
    paths:
      - packages/vitest-plugin-sveltekit/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/chromatic-vitest-plugin-sveltekit.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - packages/vitest-plugin-sveltekit/**
      - patches/**
      - pnpm-lock.yaml
      - .github/workflows/chromatic-vitest-plugin-sveltekit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic
    # PRs from forks don't get the project token.
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR's own commit, not GitHub's merge commit with main, so the Storybook matches the
          # commit that Chromatic tests. Chromatic reads the git history to find the baselines.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 22
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Build Storybook
        run: pnpm -F vitest-plugin-sveltekit-kit-app-example storybook:build

      # The project ID is in the example's `chromatic.config.json`.
      - uses: chromaui/action@2b75e3340bcec86b4ae38c6a10f14831114e8137 # v18.14.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_VITEST_PLUGIN_SVELTEKIT }}
          workingDir: packages/vitest-plugin-sveltekit/examples/kit-app
          storybookBuildDir: storybook-static
