packages:
  - packages/*

# `pnpm add` writes new versions here; versions outside these ranges are rejected.
catalogMode: strict
cleanupUnusedCatalogs: true

catalogs:
  dev:
    '@clack/prompts': ^1.8.1
    '@types/node': ^26.6.5
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
overrides:
  vite@*: catalog:dev
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
