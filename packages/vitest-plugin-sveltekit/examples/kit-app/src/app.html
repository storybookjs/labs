<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- A demo with throwaway posts: search engines should not list it (also `static/robots.txt`). -->
    <meta name="robots" content="noindex" />
    <script>
      // The reader's theme choice before the first paint, so the page does not flash. The key is
      // THEME_STORAGE_KEY in src/lib/ui/ThemeToggle.svelte (this file cannot import it).
      try {
        const theme = localStorage.getItem('field-notes-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
